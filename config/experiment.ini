# Single full-size run. The sweep in run_experiments.bat overrides alpha,
# write_ratio and seed; this file sets the shape of the experiment.
#
# 4096 pages = 16 MB backing file, 256 frames = 1 MB resident (6.25%).
# Sized so one run takes tens of seconds on a laptop HDD rather than minutes.
total_pages    = 4096
frame_budget   = 256
access_count   = 60000
alpha          = 0.5
write_ratio    = 0.4
pattern        = zipf
zipf_s         = 0.99
durable_writes = false
dump_every     = 0
delay_ms       = 0
seed           = 1
backing_path   = results/backing.dat
csv_path       = results/runs.csv
label          = experiment
