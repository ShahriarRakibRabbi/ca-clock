# Video config: tiny arena, one frame-ring dump per access, slowed down so the
# clock hand is visible on camera. sequential makes the hand's motion obvious.
total_pages    = 64
frame_budget   = 8
# 90 accesses at 250 ms is about 22 seconds of screen time: long enough to watch
# the ring fill, the hand start moving, and dirty pages appear and be written out.
access_count   = 90
alpha          = 0.5
write_ratio    = 0.4
pattern        = sequential
zipf_s         = 0.99
durable_writes = false
dump_every     = 1
delay_ms       = 250
seed           = 12345
backing_path   = results/demo_backing.dat
csv_path       = results/demo_runs.csv
label          = demo
